# Flyway configuration of this -db. The connection comes from the environment
# (FLYWAY_URL, FLYWAY_USER, FLYWAY_PASSWORD): no credential lives in this file.
[flyway]
# Flyway reads every folder of every family, recursively. The ORDER is not the folder: it is the
# version number in the file name (V001, V002, ...), one sequence for the whole repository.
locations = ["filesystem:01_ddl", "filesystem:02_dml", "filesystem:03_dcl", "filesystem:04_tcl"]

# Annex J, J.6: one database, several -db. Flyway keeps its control table (flyway_schema_history)
# in the domain's own schema, so two -db never share it.
defaultSchema = "sales"

# The monolith's database already has the sales tables but no Flyway history. Flyway refuses such a schema
# unless it is told to start counting from a baseline. Baseline 0 means "nothing of this chain is applied
# yet", so every migration runs; the baseline ones are written with IF NOT EXISTS to be safe over those
# tables (Annex J, J.6). An empty database never needs it.
baselineOnMigrate = true
baselineVersion = "0"

# A file named outside V<version>__<description>.sql fails instead of being ignored.
validateMigrationNaming = true
# clean drops everything. It is never needed: rollbacks are scripts (05_rollbacks/).
cleanDisabled = true

# CREATE INDEX CONCURRENTLY waits for every open transaction to finish, and with the default
# transactional advisory lock Flyway keeps one open itself: the migration hangs for ever. With the
# lock outside a transaction, Flyway runs such a statement non-transactionally and records it.
# The schemas Flyway manages and creates when missing. In flyway.toml they belong to an environment.
[environments.default]
schemas = ["sales"]

[flyway.postgresql.transactional]
lock = false
